name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt 시스템 라이브러리 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk
      - name: 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e ".[whisper,dev]" ruff
      - name: 정적 검사
        run: ruff check src tests --select F,E9
      - name: 테스트
        run: python -m pytest -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: exe 빌드
        shell: pwsh
        run: ./scripts/build_exe.ps1
      - name: 실행 스모크 테스트 (25초 실행 후 종료)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:WORKREPORT_HOME = "$env:RUNNER_TEMP\wrhome"
          $p = Start-Process -FilePath dist\WorkReport.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "WorkReport.exe 가 바로 종료되었습니다 (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          $log = Get-Content "$env:WORKREPORT_HOME\logs\workreport.log" -Raw
          Write-Host $log
          if ($log -notmatch "WorkReport 시작") { throw "시작 로그가 없습니다" }
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReport-windows
          path: dist/WorkReport.exe
          if-no-files-found: error
